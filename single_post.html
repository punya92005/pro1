<!-- templates/single_post.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Post</title>
</head>
<body>

<h2>{{ post['user'] }}</h2>

{% if post['image'] %}
<img
src="{{ url_for('static', filename='uploads/' + post['image']) }}"
width="300">
{% endif %}

<p>{{ post['caption'] }}</p>

<hr>

<h3>Comments</h3>

{% for c in comments %}

<p>
<b>{{ c['user'] }}</b> :
{{ c['comment'] }}
</p>

{% endfor %}

</body>
</html>
